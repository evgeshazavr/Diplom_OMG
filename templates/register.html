{% extends 'base.html' %}
{% block content %}
<h2>Регистрация</h2>
<form method="POST">
    <div class="mb-3"><input type="text" name="username" placeholder="Username" required class="form-control"></div>
    <div class="mb-3"><input type="password" name="password" placeholder="Password" required class="form-control"></div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
</form>
{% endblock %}
